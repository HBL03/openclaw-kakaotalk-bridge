[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-kakao-local"
version = "0.1.0.dev1"
description = "Single-user Windows KakaoTalk local bridge for OpenClaw"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "websockets==15.0.1",
  "pywin32==311; sys_platform == 'win32'",
  "PySide6==6.8.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13", "pyinstaller==6.14.2"]

[project.scripts]
kakao-local = "kakao_local.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../tests/unit", "../../tests/integration"]

[tool.ruff]
line-length = 110
target-version = "py311"
